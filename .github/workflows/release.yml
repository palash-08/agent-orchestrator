name: Release desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.14.6-agy.1)"
        required: true
        type: string
        default: "v0.14.6-agy.1"

permissions:
  contents: write

env:
  VITE_WORKOS_CLIENT_ID: ${{ vars.VITE_WORKOS_CLIENT_ID || 'client_01KZ3VRKC374HS91XGRDPT3671' }}
  AO_RELEASE_REPO: ${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32-x64
            artifact: win32-x64
          - os: ubuntu-22.04
            platform: linux-x64
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            packages/product-ui/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm ci
      - name: Install product UI dependencies
        run: npm ci
        working-directory: packages/product-ui
      - name: Stamp version
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          echo "Stamping version $VERSION into package.json"
          node -e "const v='$VERSION'.split('+')[0]; const fs=require('fs'); const p=require('./package.json'); p.version=v; fs.writeFileSync('./package.json', JSON.stringify(p,null,'\t')+'\n');"
      - name: Use clang++-15 for native modules
        if: runner.os == 'Linux'
        shell: bash
        run: |
          command -v clang++-15
          echo "CXX=clang++-15" >> "$GITHUB_ENV"
      - name: Build (unsigned, no publish)
        shell: bash
        run: npm run make
      - name: Verify baked update feed repo
        shell: bash
        run: |
          set -euo pipefail
          owner="$(sed -n 's/^owner:[[:space:]]*//p' app-update.yml)"
          repo="$(sed -n 's/^repo:[[:space:]]*//p' app-update.yml)"
          echo "baked feed: $owner/$repo (expected $GITHUB_REPOSITORY)"
          if [ "$owner/$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::app-update.yml bakes $owner/$repo but this build publishes from $GITHUB_REPOSITORY" >&2
            exit 1
          fi
      - name: Collect artifacts
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist-artifact
          case "$PLATFORM" in
            win32-x64)
              src="$(find out/make -maxdepth 1 -name '*Setup*.exe' | head -n1)"
              if [ -z "$src" ]; then echo "No setup exe found" >&2; exit 1; fi
              cp "$src" "dist-artifact/agent-orchestrator-win32-x64.exe"
              if [ "$(basename "$src")" != "agent-orchestrator-win32-x64.exe" ]; then
                cp "$src" "dist-artifact/$(basename "$src")"
              fi
              ;;
            linux-x64)
              src="$(find out/make -maxdepth 1 -name '*.AppImage' | head -n1)"
              if [ -z "$src" ]; then echo "No AppImage found" >&2; exit 1; fi
              cp "$src" "dist-artifact/agent-orchestrator-linux-x64.AppImage"
              if [ "$(basename "$src")" != "agent-orchestrator-linux-x64.AppImage" ]; then
                cp "$src" "dist-artifact/$(basename "$src")"
              fi
              deb="$(find out/make -name '*.deb' | head -n1 || true)"
              if [ -n "$deb" ]; then cp "$deb" "dist-artifact/"; fi
              rpm="$(find out/make -name '*.rpm' | head -n1 || true)"
              if [ -n "$rpm" ]; then cp "$rpm" "dist-artifact/"; fi
              ;;
          esac
          ls -la dist-artifact
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}
          path: frontend/dist-artifact/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          path: dist-release
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "Publishing release for $TAG"
          mkdir -p release-files
          find dist-release -type f \( -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} release-files/ \;
          echo "Files to upload:"
          ls -lh release-files/
          
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading assets..."
            gh release upload "$TAG" release-files/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" release-files/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Agent Orchestrator $TAG" \
              --notes "Release $TAG with multi-account support for Antigravity (AGY)."
          fi
